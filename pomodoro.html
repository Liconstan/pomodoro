<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🍅 Fun Pomodoro Timer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
    background-size: 400% 400%;
    animation: gradientShift 15s ease infinite;
    overflow: hidden;
    transition: background 0.8s ease;
  }

  body.break-mode {
    background: linear-gradient(135deg, #a8e6cf, #88d8c0, #7fcdcd, #b4d4ee);
    background-size: 400% 400%;
    animation: gradientShift 15s ease infinite;
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .container {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(20px);
    border-radius: 32px;
    padding: 48px 56px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
    text-align: center;
    max-width: 480px;
    width: 90%;
    position: relative;
    z-index: 10;
  }

  h1 {
    font-size: 2.2rem;
    margin-bottom: 8px;
    color: #2d3436;
  }

  .subtitle {
    color: #636e72;
    margin-bottom: 32px;
    font-size: 0.95rem;
  }

  .mode-tabs {
    display: flex;
    gap: 8px;
    background: #f1f2f6;
    padding: 6px;
    border-radius: 14px;
    margin-bottom: 32px;
  }

  .mode-tab {
    flex: 1;
    padding: 10px;
    border: none;
    background: transparent;
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 600;
    color: #636e72;
    transition: all 0.3s;
  }

  .mode-tab.active {
    background: white;
    color: #ff6b6b;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
  }

  .tomato {
    font-size: 5rem;
    margin-bottom: 16px;
    display: inline-block;
    transition: transform 0.3s;
  }

  .tomato.running {
    animation: bounce 1s ease infinite;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    25% { transform: translateY(-12px) rotate(-5deg); }
    75% { transform: translateY(-12px) rotate(5deg); }
  }

  .timer {
    font-size: 6rem;
    font-weight: 800;
    color: #2d3436;
    font-variant-numeric: tabular-nums;
    margin-bottom: 8px;
    letter-spacing: -2px;
  }

  .session-label {
    font-size: 1rem;
    color: #636e72;
    margin-bottom: 32px;
    font-weight: 500;
  }

  .progress-ring {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .timer-wrapper {
    position: relative;
    margin-bottom: 32px;
  }

  .controls {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-bottom: 24px;
  }

  button.action {
    padding: 14px 32px;
    border: none;
    border-radius: 14px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  button.start {
    background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
    color: white;
    box-shadow: 0 4px 14px rgba(238, 90, 111, 0.4);
  }

  button.start:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(238, 90, 111, 0.5);
  }

  button.reset {
    background: #f1f2f6;
    color: #636e72;
  }

  button.reset:hover {
    background: #dfe4ea;
  }

  .stats {
    display: flex;
    justify-content: space-around;
    padding-top: 24px;
    border-top: 2px dashed #f1f2f6;
  }

  .stat {
    text-align: center;
  }

  .stat-value {
    font-size: 1.8rem;
    font-weight: 800;
    color: #ff6b6b;
  }

  .stat-label {
    font-size: 0.75rem;
    color: #636e72;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 4px;
  }

  /* floating emojis in background */
  .floater {
    position: absolute;
    font-size: 2.5rem;
    opacity: 0.5;
    animation: float 20s linear infinite;
    pointer-events: none;
  }

  @keyframes float {
    0% { transform: translateY(110vh) rotate(0deg); }
    100% { transform: translateY(-20vh) rotate(360deg); }
  }

  .confetti {
    position: fixed;
    width: 10px;
    height: 10px;
    pointer-events: none;
    z-index: 100;
    animation: confettiFall 3s ease-out forwards;
  }

  @keyframes confettiFall {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }
</style>
</head>
<body>

<div class="container">
  <h1>🍅 Pomodoro Timer</h1>
  <p class="subtitle">Focus. Break. Repeat.</p>

  <div class="mode-tabs">
    <button class="mode-tab active" data-mode="focus" data-minutes="25">Focus</button>
    <button class="mode-tab" data-mode="short" data-minutes="5">Short Break</button>
    <button class="mode-tab" data-mode="long" data-minutes="15">Long Break</button>
  </div>

  <div class="timer-wrapper">
    <div class="tomato" id="tomato">🍅</div>
    <div class="timer" id="timer">25:00</div>
    <div class="session-label" id="sessionLabel">Time to focus! 🎯</div>
  </div>

  <div class="controls">
    <button class="action start" id="startBtn">Start</button>
    <button class="action reset" id="resetBtn">Reset</button>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-value" id="completedCount">0</div>
      <div class="stat-label">🍅 Completed</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="streakCount">0</div>
      <div class="stat-label">🔥 Streak</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="totalMinutes">0</div>
      <div class="stat-label">⏱️ Minutes</div>
    </div>
  </div>
</div>

<script>
  const timerEl = document.getElementById('timer');
  const tomatoEl = document.getElementById('tomato');
  const startBtn = document.getElementById('startBtn');
  const resetBtn = document.getElementById('resetBtn');
  const sessionLabel = document.getElementById('sessionLabel');
  const completedCountEl = document.getElementById('completedCount');
  const streakCountEl = document.getElementById('streakCount');
  const totalMinutesEl = document.getElementById('totalMinutes');
  const tabs = document.querySelectorAll('.mode-tab');

  let totalSeconds = 25 * 60;
  let secondsLeft = totalSeconds;
  let intervalId = null;
  let isRunning = false;
  let currentMode = 'focus';
  let completedCount = 0;
  let streakCount = 0;
  let totalMinutes = 0;

  const modeMessages = {
    focus: ['Time to focus! 🎯', 'You got this! 💪', 'Deep work mode 🧠', 'Crush it! 🚀'],
    short: ['Quick breather! 🌿', 'Stretch a little 🧘', 'Sip some water 💧', 'Look outside 👀'],
    long: ['Big break time! 🌴', 'Recharge fully ⚡', 'Take a walk 🚶', 'You earned it! 🏆']
  };

  function updateDisplay() {
    const m = Math.floor(secondsLeft / 60);
    const s = secondsLeft % 60;
    timerEl.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    document.title = `${timerEl.textContent} - 🍅 Pomodoro`;
  }

  function setMode(mode, minutes) {
    currentMode = mode;
    totalSeconds = minutes * 60;
    secondsLeft = totalSeconds;
    pauseTimer();
    updateDisplay();
    const messages = modeMessages[mode];
    sessionLabel.textContent = messages[Math.floor(Math.random() * messages.length)];
    document.body.classList.toggle('break-mode', mode !== 'focus');
    tabs.forEach(t => t.classList.toggle('active', t.dataset.mode === mode));
  }

  function startTimer() {
    if (isRunning) {
      pauseTimer();
      return;
    }
    isRunning = true;
    startBtn.textContent = 'Pause';
    tomatoEl.classList.add('running');
    intervalId = setInterval(tick, 1000);
  }

  function pauseTimer() {
    isRunning = false;
    startBtn.textContent = 'Start';
    tomatoEl.classList.remove('running');
    if (intervalId) clearInterval(intervalId);
    intervalId = null;
  }

  function tick() {
    secondsLeft--;
    updateDisplay();
    if (secondsLeft <= 0) {
      pauseTimer();
      sessionComplete();
    }
  }

  function resetTimer() {
    pauseTimer();
    secondsLeft = totalSeconds;
    updateDisplay();
  }

  function sessionComplete() {
    playChime();
    burstConfetti();
    if (currentMode === 'focus') {
      completedCount++;
      streakCount++;
      totalMinutes += Math.round(totalSeconds / 60);
      completedCountEl.textContent = completedCount;
      streakCountEl.textContent = streakCount;
      totalMinutesEl.textContent = totalMinutes;
      sessionLabel.textContent = '🎉 Pomodoro done! Take a break.';
      const nextMode = completedCount % 4 === 0 ? 'long' : 'short';
      const nextMinutes = nextMode === 'long' ? 15 : 5;
      setTimeout(() => setMode(nextMode, nextMinutes), 1500);
    } else {
      sessionLabel.textContent = '✨ Break over! Ready to focus?';
      setTimeout(() => setMode('focus', 25), 1500);
    }
  }

  function playChime() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const notes = [523.25, 659.25, 783.99, 1046.5];
      notes.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.value = freq;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0, ctx.currentTime + i * 0.15);
        gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + i * 0.15 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.15 + 0.4);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime + i * 0.15);
        osc.stop(ctx.currentTime + i * 0.15 + 0.4);
      });
    } catch (e) { /* audio not available */ }
  }

  function burstConfetti() {
    const colors = ['#ff6b6b', '#feca57', '#48dbfb', '#ff9ff3', '#1dd1a1', '#5f27cd'];
    const emojis = ['🍅', '🎉', '⭐', '✨', '🎊'];
    for (let i = 0; i < 60; i++) {
      const piece = document.createElement('div');
      const useEmoji = Math.random() > 0.6;
      if (useEmoji) {
        piece.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        piece.style.fontSize = '24px';
      } else {
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      }
      piece.className = 'confetti';
      piece.style.left = Math.random() * 100 + 'vw';
      piece.style.top = '-20px';
      piece.style.animationDelay = Math.random() * 0.5 + 's';
      piece.style.animationDuration = (2 + Math.random() * 2) + 's';
      document.body.appendChild(piece);
      setTimeout(() => piece.remove(), 4000);
    }
  }

  function spawnFloaters() {
    const emojis = ['🍅', '⏰', '✨', '🌿', '☕', '🎯'];
    setInterval(() => {
      const f = document.createElement('div');
      f.className = 'floater';
      const emoji = emojis[Math.floor(Math.random() * emojis.length)];
      f.textContent = emoji;
      if (emoji === '🍅') f.style.fontSize = '5rem';
      f.style.left = Math.random() * 100 + 'vw';
      f.style.animationDuration = (15 + Math.random() * 15) + 's';
      document.body.appendChild(f);
      setTimeout(() => f.remove(), 30000);
    }, 3000);
  }

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      setMode(tab.dataset.mode, parseInt(tab.dataset.minutes, 10));
    });
  });

  startBtn.addEventListener('click', startTimer);
  resetBtn.addEventListener('click', resetTimer);

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && e.target.tagName !== 'BUTTON') {
      e.preventDefault();
      startTimer();
    } else if (e.code === 'KeyR') {
      resetTimer();
    }
  });

  updateDisplay();
  spawnFloaters();
</script>

</body>
</html>
